<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to TripNest to view saved trips, favorite destinations, budgets, and travel statistics.">
    <title>Login | TripNest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <nav class="navbar" aria-label="Primary navigation">
        <a class="logo" href="../index.html"><i class="fa-solid fa-plane-departure"></i>TripNest</a>
        <button class="icon-btn menu-toggle" type="button" aria-label="Open navigation"><i class="fa-solid fa-bars"></i></button>
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="../destinations.html">Destinations</a></li>
            <li><a href="../planner.html">AI Planner</a></li>
            <li><a href="../budget.html">Budget</a></li>
            <li><a href="../contact.html">Contact</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
        </ul>
        <div class="nav-actions"><a href="signup.html" class="login-btn">Signup</a></div>
    </nav>

    <main class="auth-wrap">
        <section class="auth-card" data-animate>
            <a class="logo" href="../index.html"><i class="fa-solid fa-plane-departure"></i>TripNest</a>
            <h1>Welcome back</h1>
            <p class="muted">Mock authentication today, Firebase or Supabase tomorrow.</p>
            <form id="loginForm">
                <label class="field">Email<input id="loginEmail" type="email" placeholder="you@example.com" required></label>
                <label class="field">Password<input id="loginPassword" type="password" placeholder="Password" required></label>
                <button class="btn" type="submit">Login</button>
            </form>
            <p class="auth-alt"><a href="forgot-password.html">Forgot password?</a> | <a href="signup.html">Create account</a></p>
            <p id="authMessage" class="muted" aria-live="polite"></p>
        </section>
    </main>

    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/animations.js"></script>
</body>
</html>
