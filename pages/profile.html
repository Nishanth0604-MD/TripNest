<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TripNest profile page for future Firebase or Supabase account data integration.">
    <title>Profile | TripNest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <nav class="navbar" aria-label="Primary navigation">
        <a class="logo" href="../index.html"><i class="fa-solid fa-plane-departure"></i>TripNest</a>
        <button class="icon-btn menu-toggle" type="button" aria-label="Open navigation"><i class="fa-solid fa-bars"></i></button>
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="../destinations.html">Destinations</a></li>
            <li><a href="../planner.html">AI Planner</a></li>
            <li><a href="../budget.html">Budget</a></li>
            <li><a href="../contact.html">Contact</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
        </ul>
        <div class="nav-actions"><a href="login.html" class="login-btn">Logout</a></div>
    </nav>

    <main>
        <section class="page-hero">
            <div class="shell" data-animate>
                <span class="hero-tag"><i class="fa-solid fa-user"></i>Profile</span>
                <h1>Manage your traveler identity</h1>
                <p>Local profile mockup structured for future authentication and database integration.</p>
            </div>
        </section>

        <section class="dashboard-layout shell">
            <aside class="sidebar" data-animate>
                <div class="profile-mini"><span class="profile-avatar">TN</span><div><h3>TripNest User</h3><p class="muted">Explorer plan</p></div></div>
                <nav><a href="dashboard.html">Overview</a><a class="active" href="profile.html">Profile</a><a href="../planner.html">Create trip</a></nav>
            </aside>
            <section class="dashboard-card" data-animate>
                <h2>Profile details</h2>
                <form class="trip-form" id="profileForm">
                    <label>Full name<input id="profileName" type="text" value="TripNest User"></label>
                    <label>Email<input id="profileEmail" type="email" value="traveler@tripnest.example"></label>
                    <label>Home airport<input id="profileAirport" type="text" value="BLR"></label>
                    <label>Preferred style
                        <select id="profileStyle">
                            <option>Luxury</option>
                            <option selected>Adventure</option>
                            <option>Budget</option>
                            <option>Family</option>
                            <option>Solo</option>
                        </select>
                    </label>
                    <button class="btn" type="submit">Save profile</button>
                    <p id="profileMessage" class="muted" aria-live="polite"></p>
                </form>
            </section>
        </section>
    </main>

    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/animations.js"></script>
</body>
</html>
